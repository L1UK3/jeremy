[project]
name = "jeremy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle-environments>=1.32.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "torch>=2.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["N812", "E402"]

